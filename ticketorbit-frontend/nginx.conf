# HTTP server
server {
    listen 80;
    server_name ticketorbit.duckdns.org;

    # Allow Let's Encrypt renewal challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


# HTTPS server
server {
    listen 443 ssl;
    server_name ticketorbit.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/ticketorbit.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ticketorbit.duckdns.org/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # React frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Spring Boot backend
    location /api/ {
        proxy_pass http://backend-service:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}