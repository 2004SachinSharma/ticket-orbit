services:
  postgres:
    image: postgres:latest
    container_name: my-postgres
    environment:
      POSTGRES_DB: ticketorbitdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mycustompass
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketorbitdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    external: true
