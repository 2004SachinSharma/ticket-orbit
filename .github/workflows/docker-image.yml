name: TicketOrbit Docker Image CI/CD

on:
  # Run CI whenever a PR targets main and CD after a push to main
  pull_request:
    branches: ["main"]

  push:
    branches: ["main"]

jobs:

  # CI: Test application code and validate Docker image builds
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up Java and execute backend tests
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Backend Tests
        run: |
          chmod +x mvnw
          ./mvnw test

      # Set up Node.js and validate frontend production build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend
        working-directory: ./ticketorbit-frontend
        run: |
          npm ci
          npm run build

      # Validate that both backend and frontend Docker images build successfully
      - name: Build Backend Docker Image
        run: |
          docker build -t ticketorbit-backend-test .

      - name: Build Frontend Docker Image
        run: |
          docker build -t ticketorbit-frontend-test ./ticketorbit-frontend

  # CD: Build, push and deploy production images only after merging into main
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate with Docker Hub to push production images
      - name: Docker Hub Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build backend image with commit SHA and latest tags
      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ticketorbit-backend-image:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ticketorbit-backend-image:latest \
            .

      # Build frontend image with commit SHA and latest tags
      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ticketorbit-frontend-image:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ticketorbit-frontend-image:latest \
            ./ticketorbit-frontend

      # Push both backend image tags to Docker Hub
      - name: Push Backend Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ticketorbit-backend-image:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ticketorbit-backend-image:latest

      # Push both frontend image tags to Docker Hub
      - name: Push Frontend Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ticketorbit-frontend-image:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ticketorbit-frontend-image:latest

      # Create the deployment directory on EC2
      - name: Prepare EC2 Deployment Directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/deployment

      # Transfer the production Docker Compose file to EC2
      - name: Copy Docker Compose to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/deployment/"

      # Connect to EC2 and deploy images matching the current commit SHA
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            cd ~/deployment

            echo "Deploying TicketOrbit version: $IMAGE_TAG"

            sudo env IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.prod.yml pull

            sudo env IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.prod.yml up -d