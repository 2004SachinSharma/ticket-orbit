name: TicketOrbit Docker Image CI/CD

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  # ---------- Phase 1: CI (runs when a PR is raised) ----------
  ci-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 3. Build Backend JAR
      - name: Build Backend
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      # 4. Build Backend Docker Image (not pushed)
      - name: Build Backend Docker Image
        run: docker build -t ticketorbit-backend-image:ci .

      # 5. Build Frontend Docker Image (not pushed)
      - name: Build Frontend Docker Image
        run: docker build -t ticketorbit-frontend-image:ci ./ticketorbit-frontend

  # ---------- Phase 2: CD (runs when merged / pushed to main) ----------
  cd-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 3. Build Backend JAR
      - name: Build Backend
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      # 4. Login to Docker Hub
      - name: Docker Hub Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build Backend Docker Image
      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ticketorbit-backend-image:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ticketorbit-backend-image:latest \
            .

      # 6. Build Frontend Docker Image
      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ticketorbit-frontend-image:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ticketorbit-frontend-image:latest \
            ./ticketorbit-frontend

      # 7. Push Backend Docker Image
      - name: Push Backend Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ticketorbit-backend-image:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ticketorbit-backend-image:latest

      # 8. Push Frontend Docker Image
      - name: Push Frontend Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ticketorbit-frontend-image:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ticketorbit-frontend-image:latest

      # 9. Prepare EC2 Deployment Directory
      - name: Prepare EC2 Deployment Directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/deployment

      # 10. Copy Docker Compose To EC2
      - name: Copy Docker Compose to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/deployment/"

      # 11. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            cd ~/deployment

            echo "Deploying TicketOrbit version: $IMAGE_TAG"

            sudo env IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.prod.yml pull

            sudo env IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.prod.yml up -d